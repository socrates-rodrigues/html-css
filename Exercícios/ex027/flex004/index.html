<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: bisque;
            display: flex;
            height: 300px;
            flex-flow: row nowrap;
            justify-content: space-between;
            align-items: center;
        }
        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            /*flex: auto;*/
            /*width: 150px;*/
            flex-basis: 120px;
        }
        #i1 {
            align-self: flex-start;
        }
        #i2 {
            align-self: flex-end;
        }
        #i5 {
            align-self: stretch;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">Exemplo de item A</div>
        <div class="item" id="i2">Exemplo de item B</div>
        <div class="item" id="i3">Exemplo de item C</div>
        <div class="item" id="i4">Exemplo de item D</div>
        <div class="item" id="i5">Exemplo de item E</div>
        <div class="item" id="i6">Exemplo de item F</div>
        <div class="item" id="i7">Exemplo de item G</div>
    </div>
</body>
</html>
