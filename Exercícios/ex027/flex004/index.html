<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: bisque;
            display: flex;
            height: 300px;
            flex-flow: row-reverse wrap;
            justify-content: space-between;
            align-items: center;
        }
        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            /*flex: auto;*/
            /*width: 150px;*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de item A</div>
        <div class="item">Exemplo de item B</div>
        <div class="item">Exemplo de item C</div>
        <div class="item">Exemplo de item D</div>
        <div class="item">Exemplo de item E</div>
        <div class="item">Exemplo de item F</div>
        <div class="item">Exemplo de item G</div>
    </div>
</body>
</html>
